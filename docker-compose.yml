services:
  scanner:
    build: .
    container_name: cs2-arbitrage-scanner
    ports:
      - "8000:8000"
    environment:
      - CSFLOAT_API_KEY=${CSFLOAT_API_KEY:-}
      - REFRESH_INTERVAL_SECONDS=60
      - MAX_DATA_AGE_SECONDS=120
      - MIN_ROI_PERCENT=10.0
      - MIN_PROFIT_USD=1.00
      - MAX_SKIN_PRICE_USD=1000.00
    volumes:
      - ./arbitrage.db:/app/arbitrage.db
    restart: unless-stopped
